name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test
  magpie-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned official host
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory .local-validation | Out-Null
          gh release download v0.1.3250 --repo yetone/magpie --pattern magpie-cli-windows-amd64.exe --dir .local-validation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType File .local-validation/.portable | Out-Null
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check settings save inside real browser sandbox
        shell: pwsh
        run: node tooling/browser-ui-smoke.mjs
      - name: Check read-only monitor through browser proxy fixture
        shell: pwsh
        run: node tooling/browser-monitor-smoke.mjs
      - name: Check official host with synthetic credentials
        shell: pwsh
        run: ./test/magpie-host-smoke.ps1
